name: closed-branch

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  closed-branch:
    name: closed-branch
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'main' && !startsWith(github.event.pull_request.head.ref, 'archive/')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" || echo "The branch $BRANCH was already gone."
